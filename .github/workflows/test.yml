name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .
      - name: Import sanity
        run: |
          python -c "from bounty_radar_mcp.server import mcp; print('imports OK')"
      - name: Live feed reachable
        run: |
          python -c "
          from bounty_radar_mcp.server import _fetch_feed
          d = _fetch_feed()
          assert 'bounties' in d, f'no bounties key in {d.keys()}'
          assert len(d['bounties']) > 0, 'feed empty'
          print(f'feed has {len(d["bounties"])} bounties')
          "
